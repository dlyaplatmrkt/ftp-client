name: ftp_client
description: FTP VPN Client - Fast and secure VPN for Windows
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.3
  http: ^1.2.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  window_manager: ^0.3.9
  flutter_animate: ^4.5.0
  process_run: ^1.1.0
  uuid: ^4.4.0
  dio: ^5.7.0
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  archive: ^3.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/
