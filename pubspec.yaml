name: ftp_client
description: FTP VPN Client - Fast and secure VPN for Windows
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  http: ^1.1.0
  path_provider: ^2.1.1
  url_launcher: ^6.2.2
  window_manager: ^0.3.7
  flutter_animate: ^4.3.0
  process_run: ^0.13.5
  uuid: ^4.2.2
  dio: ^5.3.3
  intl: ^0.18.1
  package_info_plus: ^4.2.0
  archive: ^3.4.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  msix: ^3.16.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/
