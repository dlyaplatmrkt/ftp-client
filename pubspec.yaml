name: ftp_client
description: FTP VPN Client - Fast and secure VPN for Windows
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  http: ^1.1.0
  path_provider: ^2.1.1
  url_launcher: ^6.2.2
  window_manager: ^0.3.7
  flutter_animate: ^4.3.0
  lottie: ^2.7.0
  bitsdojo_window: ^0.1.6
  dart_ping: ^8.0.2
  process_run: ^0.12.5+1
  archive: ^3.4.9
  crypto: ^3.0.3
  uuid: ^4.2.2
  qr_code_scanner: ^1.0.1
  image_picker: ^1.0.4
  clipboard: ^0.1.3
  fluttertoast: ^8.2.4
  animated_text_kit: ^4.2.2
  fl_chart: ^0.65.0
  dio: ^5.3.3
  flutter_svg: ^2.0.9
  intl: ^0.18.1
  package_info_plus: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  msix: ^3.16.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
