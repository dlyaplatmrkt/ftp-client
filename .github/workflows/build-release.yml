name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Bootstrap Windows runner
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name=ftp_client temp_bootstrap
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          Copy-Item -Recurse temp_bootstrap\windows .\windows
          Remove-Item -Recurse -Force temp_bootstrap
          Write-Host "Windows runner ready"

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Download Xray-core
        shell: pwsh
        run: |
          $url = "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $url -OutFile xray.zip -UseBasicParsing
          New-Item -ItemType Directory -Force "build\windows\x64\runner\Release\xray" | Out-Null
          Expand-Archive xray.zip "build\windows\x64\runner\Release\xray" -Force
          Remove-Item xray.zip
          Write-Host "Xray bundled"

      - name: Get version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (!$v) { $v = ("${{ github.ref_name }}" -replace '^v') }
          if (!$v) { $v = "1.0.0" }
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $v"

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.VERSION }}"
          $buildDir = (Resolve-Path "build\windows\x64\runner\Release").Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "ISCC.exe" }
          & $iscc /DAppVersion=$v "/DBuildDir=$buildDir" installer\setup.iss /O"."
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Get-ChildItem *.exe

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.VERSION }}"
          Compress-Archive "build\windows\x64\runner\Release\*" "FTPVPNClient-Portable-v$v-Windows.zip" -Force
          Write-Host "Portable ZIP ready"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VERSION }}
          name: FTP VPN Client v${{ steps.ver.outputs.VERSION }}
          draft: false
          prerelease: false
          body: |
            ## FTP VPN Client v${{ steps.ver.outputs.VERSION }} для Windows

            Быстрый и безопасный VPN клиент — аналог Hiddify. Поддерживает VLESS, VMess, Shadowsocks, Trojan.

            ---

            ### Установка (рекомендуется)
            1. Скачайте `FTPVPNClient-Setup-v${{ steps.ver.outputs.VERSION }}.exe`
            2. Запустите от имени **Администратора**
            3. Следуйте установщику

            ### После установки
            1. Settings → **Download** (скачать Xray Core)
            2. Configs → **Add** → вставьте VLESS/VMess URI
            3. Home → нажмите кнопку подключения

            ### Portable (без установки)
            Распакуйте `FTPVPNClient-Portable-*.zip` и запустите `ftp_client.exe`

            ---

            ### Требования
            - Windows 10 / 11 (64-bit)
            - Права администратора

            ### Протоколы
            `VLESS` `VLESS+Reality` `VMess` `Shadowsocks` `Trojan` `Hysteria2`
          files: |
            FTPVPNClient-Setup-v${{ steps.ver.outputs.VERSION }}.exe
            FTPVPNClient-Portable-v${{ steps.ver.outputs.VERSION }}-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
